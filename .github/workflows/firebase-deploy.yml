name: CI/CD Portfolio Deployment
on:
  push:
    branches:
      - master

permissions:
  contents: read
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- FRONTEND BUILD ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Frontend Dependencies & Build
        run: |
          npm ci
          npm run build

      # --- AUTHENTICATION ---
      - name: Authenticate to Google Cloud via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/489381507990/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-action-1335663638@axiomatic-spark-505611-t0.iam.gserviceaccount.com'

      # Installs the gcloud CLI on top of the WIF credential above, so later steps can
      # mint tokens from it. Runs before the hosting deploy for that reason.
      - name: Set up Cloud SDK Config
        uses: google-github-actions/setup-gcloud@v2

      # Mints an OAuth 2.0 access token from the same workload identity provider and service
      # account as the identity step above - the token path that step already uses. It writes
      # no credential file and exports no environment variables, so the credential file (and
      # the GOOGLE_APPLICATION_CREDENTIALS / CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE pointers)
      # the registry and Cloud Run steps rely on stay exactly as the identity step left them.
      - name: Mint access token for Firebase Hosting
        id: firebase_token
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/489381507990/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-action-1335663638@axiomatic-spark-505611-t0.iam.gserviceaccount.com'
          token_format: 'access_token'
          create_credentials_file: 'false'
          export_environment_variables: 'false'

      # --- FRONTEND DEPLOY ---
      # The Firebase CLI does not accept the ambient WIF credential file, so it gets an
      # explicit access token from the step above. The token is handed over through a step-level
      # environment variable and referenced by name, because GitHub prints the fully
      # interpolated script of a run step to the log: inlining the token would publish it.
      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ steps.firebase_token.outputs.access_token }}
        run: |
          npm install -g firebase-tools@15.30.1
          firebase deploy --only hosting --project agentos-61847 --token "$FIREBASE_TOKEN"

      # --- BACKEND DEPLOY ---
      - name: Authorize Docker Push to Google Artifact Registry
        run: |
          gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build and Push Container Image
        run: |
          cd rag-backend
          docker build -t europe-west1-docker.pkg.dev/agentos-61847/portfolio-repo/rag-backend:latest .
          docker push europe-west1-docker.pkg.dev/agentos-61847/portfolio-repo/rag-backend:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy rag-backend \
            --project=agentos-61847 \
            --image=europe-west1-docker.pkg.dev/agentos-61847/portfolio-repo/rag-backend:latest \
            --region=europe-west1 \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --max-instances=2 \
            --concurrency=80
