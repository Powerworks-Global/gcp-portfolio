name: CI/CD Portfolio Deployment
on:
  push:
    branches:
      - master

permissions:
  contents: read
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- FRONTEND BUILD ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Frontend Dependencies & Build
        run: |
          npm ci
          npm run build

      # --- AUTHENTICATION ---
      - name: Authenticate to Google Cloud via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/489381507990/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-action-1335663638@axiomatic-spark-505611-t0.iam.gserviceaccount.com'

      # Installs the gcloud CLI on top of the WIF credential above, so later steps can
      # mint tokens from it. Runs before the hosting deploy for that reason.
      - name: Set up Cloud SDK Config
        uses: google-github-actions/setup-gcloud@v2

      # --- FRONTEND DEPLOY ---
      # FRAGILE PIN, not a preference. firebase-tools is installed from the committed
      # lockfile in tooling/firebase-tools, whose whole transitive tree was frozen by
      # publish date (`npm install --before=2026-09-14T21:07:31Z`, the last known-good
      # publish) so the CLI keeps the dependency state of the last successful deploy.
      # This deliberately stops the toolchain receiving upstream fixes.
      # The deploy CLI again reads the ambient workload-identity credential file that the
      # identity step above exports (GOOGLE_APPLICATION_CREDENTIALS), as it did before
      # 2026-10-11; no OAuth token is minted because the deploy service account cannot
      # mint one for itself (iam.serviceAccounts.getAccessToken is denied, and granting
      # roles/iam.serviceAccountTokenCreator was declined for now).
      # Durable fix: grant roles/iam.serviceAccountTokenCreator on the service account to
      # the workload-identity principal. Revert: restore the token-mint step and the
      # `--token` argument (small change to this one file). See the PR that added this pin.
      - name: Install frozen firebase-tools toolchain
        run: npm ci --prefix tooling/firebase-tools

      - name: Deploy to Firebase Hosting
        run: |
          node tooling/firebase-tools/node_modules/firebase-tools/lib/bin/firebase.js deploy --only hosting --project axiomatic-spark-505611-t0

      # --- BACKEND DEPLOY ---
      - name: Authorize Docker Push to Google Artifact Registry
        run: |
          gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build and Push Container Image
        run: |
          cd rag-backend
          docker build -t europe-west1-docker.pkg.dev/axiomatic-spark-505611-t0/portfolio-repo/rag-backend:latest .
          docker push europe-west1-docker.pkg.dev/axiomatic-spark-505611-t0/portfolio-repo/rag-backend:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy rag-backend \
            --image=europe-west1-docker.pkg.dev/axiomatic-spark-505611-t0/portfolio-repo/rag-backend:latest \
            --region=europe-west1 \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --max-instances=2 \
            --concurrency=80
